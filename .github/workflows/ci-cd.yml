name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and Build
        run: dotnet build --configuration Release

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run linter
        run: dotnet format --verify-no-changes

  test:
    name: Test and Coverage
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set JWT_TEST_SECRET_KEY environment variable
        run: echo "JWT_TEST_SECRET_KEY=${{ secrets.JWT_TEST_SECRET_KEY }}" >> $GITHUB_ENV
        
      - name: Run Tests with Coverage
        run: dotnet test --configuration Release /p:CollectCoverage=true /p:Threshold=50 /p:ThresholdType=line /p:CoverletOutputFormat=cobertura

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-coverage-report
          path: '**/coverage.cobertura.xml'

  docker_build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short commit SHA
        id: get_sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -f ToDoList/Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/todoapp:${{ env.SHORT_SHA }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todoapp:${{ env.SHORT_SHA }}